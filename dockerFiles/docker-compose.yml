services:
    nginx:
        image: nginx:alpine
        container_name: nginx_proxy
        command: >
            /bin/sh -c "
            set -e;
            if ! command -v npm >/dev/null 2>&1; then apk add --no-cache nodejs npm; fi;
            cd /usr/share/nginx/html/react-app;
            npm ci --legacy-peer-deps;
            npm run build;
            exec nginx -g 'daemon off;'
            "
        environment:
            - TZ=${TZ}
            - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
            - CHOKIDAR_USEPOLLING=true
            - CHOKIDAR_INTERVAL=500
        ports:
            - "80:80"
        volumes:
            - ../html_nginx/nginx.conf:/etc/nginx/nginx.conf
            - ../html_nginx/web:/usr/share/nginx/html
            - nginx_config:/etc/nginx/conf.d
        depends_on:
            - api
        restart: unless-stopped
        networks: [web]

    postgres:
        image: postgres:15-alpine
        container_name: postgres_IAjupiterV0
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ${LOCAL_FILES_SCRIPT}:/docker-entrypoint-initdb.d
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 5s            
        ports:
            - "5432:5432"
        networks: [web]
  
    api:
        build: ../IAjupiter-server
        container_name: fastapi_IAjupiter
        depends_on:
            postgres:
                condition: service_healthy        
        environment:
            - TZ=${TZ}
            - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
        ports:
            - "0.0.0.0:8001:8000"
        volumes:
            - ../IAjupiter-server/api:/app
            - api_data:/app/data
        command: uvicorn main:app --host 0.0.0.0 --port 8000 --root-path=/api --reload    
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: unless-stopped
        networks: [web]

    scraper:
        build: ../scraper
        container_name: scraper_IAjupiter
        environment:
            - TZ=${TZ}
            - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
        volumes:
            - scraper_data:/data
        restart: unless-stopped
        networks: [web]
networks:
  web:
    driver: bridge
volumes:
  postgres_data:
  nginx_data:
  nginx_config:
  api_data:
  scraper_data:
